<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      A second layer of defense, not the first: books are cleaned when they are imported (SVG never reaches the library).
      Own scripts only, no plugins, no forms, and a short list of places the app may talk to: the owner's Mac (the same
      origin, or a Tailscale address on the public copy; scripts/bridge-csp.ts adds that at build time), MyMemory (only if you choose it),
      and jsDelivr (stroke-order data). Claude is reached through the Mac, never from the browser. frame-ancestors cannot be set from a meta tag;
      the private gateway sends X-Frame-Options: DENY, and any other host should send the same header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https://api.mymemory.translated.net https://cdn.jsdelivr.net; worker-src 'self' blob:; object-src 'none'; form-action 'none'; base-uri 'self'; manifest-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f2ea" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Read real Chinese books with tap-to-look-up pinyin, definitions and translation." />
    <meta name="application-name" content="Dushu" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dushu" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Dushu 读书</title>
    <style>
      /* Paint the right color before the stylesheet arrives, so a dark system never flashes white. */
      html { background: #f6f2ea; }
      @media (prefers-color-scheme: dark) { html:not([data-theme]) { background: #131210; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
