<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      A second layer of defense, not the first: books are cleaned when they are imported (SVG never reaches the library).
      Own scripts only, no plugins, no forms, and a short list of places the app may talk to: the owner's Mac (the same
      origin, or a Tailscale address on the public copy; scripts/bridge-csp.ts adds that at build time), MyMemory (only if you choose it),
      jsDelivr (stroke-order data) Project Gutenberg's catalog and Wikisource's search (Find a book; the books themselves come through the sync server). Claude is reached through the Mac, never from the browser. frame-ancestors cannot be set from a meta tag;
      the private gateway sends X-Frame-Options: DENY, and any other host should send the same header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https://api.mymemory.translated.net https://cdn.jsdelivr.net https://www.gutenberg.org https://*.wikisource.org; worker-src 'self' blob:; object-src 'none'; form-action 'none'; base-uri 'self'; manifest-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f2ea" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Read real books in Chinese, Japanese, Spanish, French, German, Italian, Portuguese, Russian and English, with every word a tap away: its meaning, its reading, and the sentence translated." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Globereader" />
    <meta property="og:title" content="Globereader" />
    <meta property="og:description" content="Read real books in the language you are learning, with every word a tap away. Free classics in nine languages." />
    <meta property="og:image" content="https://henryyhong.com/dushu/icons/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="application-name" content="Globereader" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Globereader" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Globereader</title>
    <style>
      /* Paint the right color before the stylesheet arrives, so a dark system never flashes white. */
      html { background: #f6f2ea; }
      @media (prefers-color-scheme: dark) { html:not([data-theme]) { background: #131210; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
